<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>NEON RIDE</title>
    <style>
      /* Full screen canvas: no scrolling, no margins, black background */
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* HIDDEN MEANS HIDDEN. The browser's own `[hidden] { display: none }` is a
         user-agent rule, so ANY author rule that sets display beats it - and
         almost every element here is a flex box. That cost two separate bugs
         with the same shape: a clipped FREN label in the corner of every tilt
         run, and a pause button sitting in the middle of the top edge of every
         frame including god-mode footage. Both were "I set .hidden and nothing
         happened", found by eye, weeks apart. `!important` here so the third
         one cannot happen; a component that needs to stay laid out while
         invisible uses opacity or visibility, not this. */
      [hidden] {
        display: none !important;
      }

      body {
        /* Disable scroll and zoom gestures on touch devices */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Only until the first resize: from then on Engine writes the canvas an
         inline size in CSS pixels, because on a phone this element's 100% is
         the layout viewport and the frame is drawn for the visible one. */
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Top left measurement overlay (filled in by StatsOverlay.js) */
      /* THE STATS OVERLAY IS A DEBUG TOOL AND MUST NEVER BLOCK PLAY.
         On a landscape phone it used to fill the left half of the screen -
         measured, 28 per cent of a 740x320 viewport - with the score drawn
         straight through it and the life pips inside it. Fifteen lines at
         12px/1.5 is 270 px, and the screen is 320.

         Small, tight and semi transparent, and the smoke test holds it to a
         fifth of the screen with nothing overlapping it. */
      .stats-overlay {
        position: fixed;
        top: 6px;
        left: 6px;
        z-index: 10;
        margin: 0;
        padding: 4px 6px;
        border: 1px solid rgba(0, 255, 255, 0.18);
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.38);
        color: rgba(127, 249, 255, 0.85);
        font: 10px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0;
        white-space: pre;
        pointer-events: none;
        /* A readout that grows a line must not grow into the road. */
        max-width: 30vw;
        max-height: 56vh;
        overflow: hidden;
      }

      /* A SHORT VIEWPORT IS THE CASE THAT BROKE. Smaller again, and capped
         above the HUD at the bottom left rather than merely made narrower -
         an overlap fixed by reshaping the panel is not fixed. */
      @media (max-height: 420px) {
        .stats-overlay {
          font-size: 8px;
          line-height: 1.2;
          padding: 3px 5px;
          max-width: 27vw;
          max-height: 50vh;
        }
      }

      /* Title card. Removes itself once the ride starts; see ui/StartScreen.js. */
      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(10, 4, 28, 0.55) 0%,
          rgba(2, 1, 8, 0.88) 70%
        );
        /* The scene keeps running behind it, so the card must not eat the
           gesture before the window-level listeners see it. */
        pointer-events: none;
        opacity: 1;
        transition: opacity 420ms ease-out;
      }

      .start-screen.start-leaving {
        opacity: 0;
      }

      .start-title {
        margin: 0;
        font: 700 clamp(2.4rem, 11vw, 5.5rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.16em;
        color: #eaf6ff;
        /* The bloom lives in the render pass, not in CSS, so the title gets its
           own glow rather than looking flat beside the road behind it. */
        text-shadow:
          0 0 10px rgba(45, 227, 255, 0.85),
          0 0 34px rgba(45, 227, 255, 0.45),
          0 0 70px rgba(255, 43, 208, 0.35);
      }

      .start-prompt {
        margin: 0;
        font: 500 clamp(0.75rem, 2.6vw, 1rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.34em;
        text-indent: 0.34em; /* letter-spacing adds a trailing gap; this recentres */
        color: rgba(200, 226, 255, 0.72);
        animation: start-pulse 2.4s ease-in-out infinite;
      }

      @keyframes start-pulse {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 1; }
      }

      /* Score during a run. Bottom left: the cluster owns the middle of the
         frame and the stats overlay owns the top left. */
      /* Landscape gate. Above everything, including the start card and the
         pause panel: while the phone is the wrong way round there is nothing
         underneath worth interacting with. */
      .controls-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
      }

      .controls-btn {
        padding: 9px 14px;
        border: 1px solid rgba(120, 220, 255, 0.35);
        border-radius: 8px;
        background: rgba(10, 30, 45, 0.7);
        color: #9fe9ff;
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.14em;
        /* Big enough to hit with a thumb on a phone held in two hands. */
        min-height: 40px;
        cursor: pointer;
      }

      .controls-btn:active {
        background: rgba(20, 60, 85, 0.9);
      }

      /* Top centre: the corners are where thumbs rest, and a pause button under
         a thumb is a run that ends whenever the phone is gripped harder. */
      .pause-button {
        position: fixed;
        top: max(10px, env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(120, 220, 255, 0.3);
        border-radius: 8px;
        background: rgba(6, 14, 24, 0.55);
        cursor: pointer;
      }

      .pause-button span {
        width: 4px;
        height: 14px;
        border-radius: 1px;
        background: #8fe4ff;
      }

      .pause-button:active {
        background: rgba(20, 60, 85, 0.85);
      }

      /* Uncaught errors, readable on a phone. Above everything, including the
         rotate gate: a crash outranks a prompt. */
      .error-panel {
        position: fixed;
        inset: 8px;
        z-index: 200;
        overflow: auto;
        padding: 12px 14px;
        border: 1px solid #ff4f7d;
        border-radius: 8px;
        background: rgba(18, 4, 10, 0.96);
        color: #ffd2dd;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }

      /* Thumb hints. POINTER-EVENTS NONE everywhere: every touch is read from
         coordinates in core/Input.js, and an element that could be pressed
         would break multi-touch the moment a thumb rested on it. */
      .hints {
        position: fixed;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        transition: opacity 900ms ease;
      }

      .hints-faded {
        opacity: 0;
      }

      .hint {
        position: absolute;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        height: 34%;
        color: rgba(160, 230, 255, 0.5);
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.22em;
      }

      .hint-left {
        left: 0;
        border-right: 1px dashed rgba(120, 200, 255, 0.14);
      }

      .hint-right {
        right: 0;
      }

      .hint-brake {
        bottom: auto;
        height: auto;
        align-items: center;
        padding: 0;
        border: 1px solid rgba(255, 90, 160, 0.4);
        border-radius: 10px;
        background: rgba(255, 60, 140, 0.07);
        color: rgba(255, 150, 190, 0.75);
      }

      /* Said once, when tilt is asked for and refused. */
      .control-notice {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        z-index: 40;
        max-width: 80vw;
        padding: 10px 16px;
        border: 1px solid rgba(255, 90, 160, 0.35);
        border-radius: 8px;
        background: rgba(10, 8, 18, 0.9);
        color: #ffd9ea;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      .rotate-gate {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #05060c;
        color: #d8e6ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .rotate-gate-on {
        display: flex;
      }

      .rotate-icon svg {
        width: 84px;
        height: 84px;
        fill: none;
        stroke: #37e6ff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* Turning, because the instruction is a movement. Slow and finite in
           feel rather than a spinner: this is a prompt, not a loading state. */
        animation: rotate-hint 2.4s ease-in-out infinite;
      }

      @keyframes rotate-hint {
        0%, 45% { transform: rotate(0deg); }
        65%, 100% { transform: rotate(-90deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .rotate-icon svg {
          animation: none;
          transform: rotate(-90deg);
        }
      }

      .rotate-title {
        font-size: clamp(18px, 5vw, 28px);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #ff4fd8;
      }

      .rotate-body {
        font-size: clamp(13px, 3.4vw, 16px);
        opacity: 0.75;
        max-width: 22em;
        line-height: 1.5;
      }

      .hud {
        position: fixed;
        left: 18px;
        bottom: 16px;
        z-index: 12;
        pointer-events: none;
        color: #eaf6ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* The frame under this is mostly bloom, so the readout carries its own
           dark halo rather than relying on whatever happens to be behind it. */
        text-shadow:
          0 0 4px rgba(0, 0, 0, 0.9),
          0 0 14px rgba(0, 0, 0, 0.7),
          0 0 26px rgba(45, 227, 255, 0.5);
      }

      .hud-score {
        font-size: clamp(1.6rem, 5vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1;
      }

      /* Lives. Sits between the score and the distance, so the one thing that
         changes suddenly is next to the two that change constantly. */
      /* The stage readout: how much is left, and the clock. Under the lives,
         so the column reads score, lives, remaining, distance - most volatile
         at the top. It must not overlap anything at 740x320; tools/hud-check
         asserts that. */
      .hud-stage {
        margin-top: 2px;
        font-size: clamp(0.72rem, 2.2vw, 0.95rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #7dffc4;
        text-shadow: 0 0 10px rgba(125, 255, 196, 0.45);
      }

      .hud-lives {
        margin-top: 2px;
        font-size: clamp(0.8rem, 2.6vw, 1.05rem);
        letter-spacing: 0.22em;
        color: #ff6e8a;
        text-shadow: 0 0 10px rgba(255, 80, 120, 0.55);
      }

      .hud-meta {
        margin-top: 4px;
        font-size: clamp(0.62rem, 1.9vw, 0.78rem);
        letter-spacing: 0.22em;
        color: rgba(190, 220, 255, 0.72);
      }

      /* THE HUD AT PHONE HEIGHT. Score and distance bottom left with the lives
         beside them, which is where the eye already is between glances at the
         road - and small enough that the block cannot climb into the stats
         panel above it. The two are the only things down this edge. */
      @media (max-height: 420px) {
        .hud {
          left: 10px;
          bottom: 8px;
        }
        .hud-score { font-size: 1.35rem; }
        .hud-lives { font-size: 0.72rem; letter-spacing: 0.18em; margin-top: 1px; }
        .hud-meta { font-size: 0.56rem; letter-spacing: 0.16em; margin-top: 2px; }
      }

      /* Pause and game over. Deliberately the same object as the title card. */
      .panel {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        text-align: center;
        padding: 0 16px;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(10, 4, 28, 0.62) 0%,
          rgba(2, 1, 8, 0.9) 70%
        );
        pointer-events: none;
        opacity: 0;
        transition: opacity 420ms ease-out;
      }

      .panel.panel-in {
        opacity: 1;
      }

      /* The two halves of the pause card: what you read, and what you press. */
      .panel-read,
      .panel-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
      }


      .panel-title {
        margin: 0 0 0.4rem;
        font: 700 clamp(1.5rem, 6.5vw, 3rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.2em;
        color: #ffd9ef;
        text-shadow:
          0 0 12px rgba(255, 43, 208, 0.8),
          0 0 44px rgba(255, 43, 208, 0.4);
      }

      .panel-score {
        font: 700 clamp(2.6rem, 13vw, 5rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.04em;
        color: #eaf6ff;
        text-shadow:
          0 0 10px rgba(45, 227, 255, 0.85),
          0 0 40px rgba(45, 227, 255, 0.4);
      }

      .panel-best {
        font: 500 clamp(0.7rem, 2.4vw, 0.9rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.26em;
        color: rgba(190, 220, 255, 0.66);
        min-height: 1.2em;
      }

      /* A record is the one moment the interface is allowed to shout. */
      .panel-record .panel-best {
        color: #9dffc9;
        text-shadow: 0 0 12px rgba(57, 255, 136, 0.7);
      }

      .panel-prompt {
        margin: 1.1rem 0 0;
        font: 500 clamp(0.7rem, 2.4vw, 0.9rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        color: rgba(200, 226, 255, 0.72);
        animation: start-pulse 2.4s ease-in-out infinite;
      }

      /* Reduced motion switch. The one thing on either card that can be
         pressed, so it is the one thing that takes pointer events. */
      .comfort-toggle {
        pointer-events: auto;
        margin-top: 1.4rem;
        padding: 10px 18px;
        border: 1px solid rgba(45, 227, 255, 0.35);
        border-radius: 999px;
        background: rgba(6, 10, 24, 0.66);
        color: rgba(200, 226, 255, 0.78);
        font: 500 clamp(0.62rem, 2vw, 0.76rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.2em;
        cursor: pointer;
        /* Comfortable to hit on a phone without looking. */
        min-height: 44px;
        transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
      }

      .comfort-toggle:hover,
      .comfort-toggle:focus-visible {
        border-color: rgba(45, 227, 255, 0.7);
        color: #eaf6ff;
        outline: none;
      }

      .comfort-toggle.comfort-on {
        border-color: rgba(57, 255, 136, 0.65);
        background: rgba(10, 30, 20, 0.7);
        color: #9dffc9;
      }

      @media (prefers-reduced-motion: reduce) {
        .start-prompt,
        .panel-prompt { animation: none; }
        .start-screen,
        .panel { transition-duration: 1ms; }
      }

      /* ================= THE SELECTION SCREENS =================
         title -> bike -> road -> start.

         Same tier as the title card (z-index 20), because they replace it in
         the same flow. The world keeps rendering behind them: on the bike
         screen that is the whole point, since the preview IS the cockpit.

         BUILT FOR 740x320 FIRST. A landscape phone is about 320 to 360 CSS
         pixels tall and the page does not scroll, so nothing here is sized in
         a way that can push a button off the bottom - the body is the only
         part allowed to take the slack, and it shrinks rather than overflows. */
      .select-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
        padding: 12px 16px;
        box-sizing: border-box;
        /* Darkest at the top, clear at the bottom, so the cockpit underneath
           stays readable while the text over the sky does not have to fight it. */
        background: linear-gradient(180deg, rgba(4, 2, 12, 0.92) 0%,
                                            rgba(4, 2, 12, 0.72) 45%,
                                            rgba(4, 2, 12, 0.18) 100%);
        /* THE CARD TAKES EVENTS. It used to be `pointer-events: none`, copied
           from the title card - and on the title card that is right, because
           its whole job is to let the gesture through to the window listener
           that starts the run. Here it was the bug: the swipe and tap handlers
           live on this element, so with pointer-events off the card never
           received a pointerdown and NOTHING a finger did reached the screen.
           On a desktop the arrow keys go to a window listener and worked
           perfectly, which is why this survived - it was broken only for the
           one input method nobody tested with. */
        pointer-events: auto;
        /* And the browser must not claim the swipe for itself. Without this,
           a horizontal drag is a pan gesture and the pointer events are
           cancelled halfway through. */
        touch-action: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .select-screen button { pointer-events: auto; }

      /* BIG ARROWS, EITHER SIDE. A screen that can only be swiped is a screen
         whose only control is invisible: nothing on it says a swipe is
         possible, and when the swipe silently failed there was no second way
         in. These are 15 per cent of the width each and the full height of the
         body, so they are impossible to miss with a thumb. */
      .select-arrow {
        position: absolute;
        top: 22%;
        bottom: 22%;
        width: clamp(52px, 15%, 108px);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(125, 200, 235, 0.25);
        border-radius: 12px;
        background: rgba(6, 12, 24, 0.5);
        color: #9fe9ff;
        font: 400 26px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .select-arrow-prev { left: 8px; }
      .select-arrow-next { right: 8px; }
      .select-arrow:active {
        background: rgba(125, 255, 196, 0.22);
        border-color: #7dffc4;
        color: #eafff6;
      }

      .select-head { flex: 0 0 auto; }
      .select-title {
        margin: 0;
        font: 700 clamp(0.85rem, 2.6vw, 1.3rem) ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.34em;
        color: #9fe9ff;
        text-shadow: 0 0 18px rgba(80, 220, 255, 0.55);
      }
      .select-body {
        flex: 1 1 auto;
        min-height: 0;
        /* Clear of the arrows on both sides. */
        padding: 0 clamp(56px, 16%, 116px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
      }
      .select-foot {
        flex: 0 0 auto;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .select-hint {
        margin: 0;
        font: 600 10px system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.16em;
        color: rgba(200, 230, 255, 0.5);
        text-align: center;
      }
      .select-confirm {
        border-color: rgba(125, 255, 196, 0.8);
        color: #7dffc4;
      }
      .select-confirm:disabled { opacity: 0.35; }

      .select-dots { display: flex; gap: 7px; }
      .select-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(160, 200, 230, 0.28);
      }
      .select-dot-on { background: var(--bike-rim, #7df2ff); }

      /* --- the bike screen ------------------------------------------------
         Laid out around an EMPTY LOWER MIDDLE. The cockpit is the preview and
         it occupies the bottom 38 per cent of the frame, so nothing goes
         there. */
      .bike-screen .select-body { justify-content: flex-start; padding-top: 2px; }
      .bike-name {
        font: 700 clamp(1.5rem, 5.2vw, 2.6rem) ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.2em;
        color: var(--bike-rim, #7df2ff);
        text-shadow: 0 0 26px rgba(125, 242, 255, 0.45);
        line-height: 1.05;
      }
      .bike-blurb {
        margin: 0;
        font: 600 10px system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.1em;
        color: rgba(210, 235, 255, 0.72);
        text-align: center;
      }
      .bike-bars {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: min(340px, 64vw);
      }
      .bike-bar { display: flex; align-items: center; gap: 8px; }
      .bike-bar-label {
        flex: 0 0 auto;
        width: 112px;
        text-align: right;
        font: 600 9px system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.13em;
        color: rgba(190, 220, 245, 0.66);
      }
      .bike-bar-track {
        flex: 1 1 auto;
        height: 6px;
        border-radius: 3px;
        background: rgba(150, 190, 220, 0.16);
        overflow: hidden;
      }
      .bike-bar-fill {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--bike-rim, #7df2ff);
        transition: width 220ms ease-out;
      }

      /* --- the mode screen -------------------------------------------------
         Two cards, and it is the first screen anybody meets. Wider and taller
         than a road card because there are only two of them and nothing to
         scroll: a mode is a decision, not a browse. */
      .mode-grid {
        display: flex;
        gap: 14px;
        align-items: stretch;
        justify-content: safe center;
        max-width: 100%;
        /* `none`, like every other card row here. pan-x lets the browser claim
           a horizontal drag and cancel the pointer stream half way through,
           which silently kills the swipe. */
        touch-action: none;
        padding: 2px;
      }
      .mode-card {
        pointer-events: auto;
        flex: 0 0 auto;
        width: clamp(140px, 30vw, 240px);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        border: 1px solid rgba(125, 200, 235, 0.28);
        border-radius: 11px;
        background: rgba(6, 12, 24, 0.66);
        cursor: pointer;
        text-align: left;
        transition: border-color 160ms ease-out, transform 160ms ease-out;
      }
      .mode-card-on {
        border-color: #7dffc4;
        transform: translateY(-2px);
        box-shadow: 0 0 18px rgba(125, 255, 196, 0.28);
      }
      .mode-label {
        font: 700 clamp(1rem, 3.4vw, 1.5rem)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.1em;
        color: #eaf6ff;
      }
      .mode-blurb {
        font: 600 clamp(8px, 1.7vw, 10px)/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.1em;
        color: rgba(190, 220, 245, 0.72);
      }

      /* --- the results card ------------------------------------------------
         The same panel as the pause card - same type, same glow, same dimmed
         ground - with one thing added: the medal. */
      .results-medal {
        font: 700 clamp(0.95rem, 3vw, 1.4rem)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.16em;
        margin-bottom: 2px;
        /* Set per medal below. The WORD carries the meaning and the colour only
           agrees with it, so a colour blind player reads the same card. */
        color: #eaf6ff;
      }
      .results-medal[data-medal="gold"] {
        color: #ffe08a;
        text-shadow: 0 0 16px rgba(255, 210, 120, 0.6);
      }
      .results-medal[data-medal="silver"] {
        color: #dfe9f2;
        text-shadow: 0 0 16px rgba(210, 230, 245, 0.5);
      }
      .results-medal[data-medal="bronze"] {
        color: #e0a877;
        text-shadow: 0 0 16px rgba(220, 150, 90, 0.45);
      }

      /* --- the road screen ------------------------------------------------ */
      .road-grid {
        display: flex;
        gap: 10px;
        align-items: stretch;
        /* `safe` matters here. With seven cards on a 740px phone the row is
           wider than the viewport, and plain `center` centres the overflow -
           which pushes the FIRST card off the left edge where it cannot be
           scrolled back to. `safe center` falls back to flex-start the moment
           it would overflow, so the row stays reachable from both ends. */
        justify-content: safe center;
        max-width: 100%;
        overflow-x: auto;
        /* `none`, like the card. pan-x was tried and it BROKE THE SWIPE: the
           browser claimed a horizontal drag as a pan of this row and cancelled
           the pointer stream half way through, so a swipe over the cards did
           nothing. Dragging the row is not needed - changing the selection
           scrolls the chosen card into view on its own. */
        touch-action: none;
        padding: 2px 2px 4px;
        scrollbar-width: none;
      }
      .road-grid::-webkit-scrollbar { display: none; }
      .road-card {
        pointer-events: auto;
        position: relative;
        flex: 0 0 auto;
        width: clamp(104px, 21vw, 168px);
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 5px;
        border: 1px solid rgba(125, 200, 235, 0.28);
        border-radius: 9px;
        background: rgba(6, 12, 24, 0.66);
        cursor: pointer;
        transition: border-color 160ms ease-out, transform 160ms ease-out;
      }
      .road-card-on {
        border-color: #7dffc4;
        transform: translateY(-2px);
        box-shadow: 0 0 18px rgba(125, 255, 196, 0.28);
      }
      .road-shot {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 5px;
        background: #05030d center/cover no-repeat;
      }
      .road-label {
        font: 700 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        color: #cfe9ff;
        text-align: center;
      }
      .road-card-mixed .road-shot {
        /* No photograph, because it is not one place. The card shows the two
           palettes meeting, which is what the option actually does. */
        background: linear-gradient(115deg, #2a0f4a 0%, #7a1f6d 42%, #0e5a52 72%, #1b8f6a 100%);
      }
      .road-card-locked { opacity: 0.4; cursor: default; }
      .road-lock {
        position: absolute;
        inset: auto 0 34% 0;
        font: 700 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.2em;
        color: #ffd166;
        text-align: center;
      }
      .road-blurb {
        margin: 0;
        min-height: 1em;
        font: 600 10px system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.1em;
        color: rgba(210, 235, 255, 0.72);
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .bike-bar-fill,
        .road-card { transition: none; }
      }

      /* THE 740x320 CASE. Everything shrinks; nothing is removed, because a
         menu that hides an option on a small screen is a menu with an option
         nobody on a phone can pick. */
      @media (max-height: 400px) {
        .select-screen { padding: 7px 12px; gap: 0.2rem; }
        .select-title { letter-spacing: 0.24em; }
        .bike-name { font-size: clamp(1.1rem, 4.4vw, 1.7rem); }
        .bike-bars { gap: 3px; width: min(300px, 58vw); }
        .bike-bar-track { height: 5px; }
        .road-card { width: clamp(92px, 18vw, 128px); }
        .select-hint { font-size: 9px; }
        .controls-btn { min-height: 34px; }
      }

      /* A LANDSCAPE PHONE IS ABOUT 360 CSS PIXELS TALL. Stacked, this card's
         six blocks ran off the bottom of it and the control buttons could not
         be reached at all - and there is nothing to scroll, because the page
         does not scroll. Below 520px of height the card lays out as two
         columns, which fits every landscape handset with room over.

         Height, not width, and not a device query: the thing that is short is
         the viewport, whatever is making it short. */
      @media (max-height: 520px) {
        .panel {
          flex-direction: row;
          gap: 2rem;
          padding: 8px 18px;
          align-items: center;
        }

        .panel-read,
        .panel-actions {
          gap: 0.4rem;
          max-width: 46vw;
        }

        /* The type has to come down with it, or the left column is what
           overflows instead of the right one. */
        .panel-title { font-size: clamp(1.1rem, 4.2vw, 1.9rem); }
        .panel-score { font-size: clamp(1.4rem, 5vw, 2.4rem); }
        .panel-prompt { font-size: clamp(0.58rem, 1.9vw, 0.76rem); }

        .controls-panel { margin-top: 4px; }
        .controls-btn { min-height: 34px; padding: 6px 10px; font-size: 10px; }
        .comfort-toggle { min-height: 34px; padding: 6px 10px; }
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
