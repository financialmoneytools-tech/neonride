<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>NEON RIDE</title>
    <style>
      /* Full screen canvas: no scrolling, no margins, black background */
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        /* Disable scroll and zoom gestures on touch devices */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Top left measurement overlay (filled in by StatsOverlay.js) */
      .stats-overlay {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        margin: 0;
        padding: 6px 10px;
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.45);
        color: #7ff9ff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
