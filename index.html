<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>NEON RIDE</title>
    <style>
      /* Full screen canvas: no scrolling, no margins, black background */
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* HIDDEN MEANS HIDDEN. The browser's own `[hidden] { display: none }` is a
         user-agent rule, so ANY author rule that sets display beats it - and
         almost every element here is a flex box. That cost two separate bugs
         with the same shape: a clipped FREN label in the corner of every tilt
         run, and a pause button sitting in the middle of the top edge of every
         frame including god-mode footage. Both were "I set .hidden and nothing
         happened", found by eye, weeks apart. `!important` here so the third
         one cannot happen; a component that needs to stay laid out while
         invisible uses opacity or visibility, not this. */
      [hidden] {
        display: none !important;
      }

      body {
        /* Disable scroll and zoom gestures on touch devices */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Only until the first resize: from then on Engine writes the canvas an
         inline size in CSS pixels, because on a phone this element's 100% is
         the layout viewport and the frame is drawn for the visible one. */
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Top left measurement overlay (filled in by StatsOverlay.js) */
      .stats-overlay {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        margin: 0;
        padding: 6px 10px;
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.45);
        color: #7ff9ff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
        white-space: pre;
        pointer-events: none;
      }

      /* Title card. Removes itself once the ride starts; see ui/StartScreen.js. */
      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(10, 4, 28, 0.55) 0%,
          rgba(2, 1, 8, 0.88) 70%
        );
        /* The scene keeps running behind it, so the card must not eat the
           gesture before the window-level listeners see it. */
        pointer-events: none;
        opacity: 1;
        transition: opacity 420ms ease-out;
      }

      .start-screen.start-leaving {
        opacity: 0;
      }

      .start-title {
        margin: 0;
        font: 700 clamp(2.4rem, 11vw, 5.5rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.16em;
        color: #eaf6ff;
        /* The bloom lives in the render pass, not in CSS, so the title gets its
           own glow rather than looking flat beside the road behind it. */
        text-shadow:
          0 0 10px rgba(45, 227, 255, 0.85),
          0 0 34px rgba(45, 227, 255, 0.45),
          0 0 70px rgba(255, 43, 208, 0.35);
      }

      .start-prompt {
        margin: 0;
        font: 500 clamp(0.75rem, 2.6vw, 1rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.34em;
        text-indent: 0.34em; /* letter-spacing adds a trailing gap; this recentres */
        color: rgba(200, 226, 255, 0.72);
        animation: start-pulse 2.4s ease-in-out infinite;
      }

      @keyframes start-pulse {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 1; }
      }

      /* Score during a run. Bottom left: the cluster owns the middle of the
         frame and the stats overlay owns the top left. */
      /* Landscape gate. Above everything, including the start card and the
         pause panel: while the phone is the wrong way round there is nothing
         underneath worth interacting with. */
      .controls-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
      }

      .controls-btn {
        padding: 9px 14px;
        border: 1px solid rgba(120, 220, 255, 0.35);
        border-radius: 8px;
        background: rgba(10, 30, 45, 0.7);
        color: #9fe9ff;
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.14em;
        /* Big enough to hit with a thumb on a phone held in two hands. */
        min-height: 40px;
        cursor: pointer;
      }

      .controls-btn:active {
        background: rgba(20, 60, 85, 0.9);
      }

      /* Top centre: the corners are where thumbs rest, and a pause button under
         a thumb is a run that ends whenever the phone is gripped harder. */
      .pause-button {
        position: fixed;
        top: max(10px, env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(120, 220, 255, 0.3);
        border-radius: 8px;
        background: rgba(6, 14, 24, 0.55);
        cursor: pointer;
      }

      .pause-button span {
        width: 4px;
        height: 14px;
        border-radius: 1px;
        background: #8fe4ff;
      }

      .pause-button:active {
        background: rgba(20, 60, 85, 0.85);
      }

      /* Uncaught errors, readable on a phone. Above everything, including the
         rotate gate: a crash outranks a prompt. */
      .error-panel {
        position: fixed;
        inset: 8px;
        z-index: 200;
        overflow: auto;
        padding: 12px 14px;
        border: 1px solid #ff4f7d;
        border-radius: 8px;
        background: rgba(18, 4, 10, 0.96);
        color: #ffd2dd;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }

      /* Thumb hints. POINTER-EVENTS NONE everywhere: every touch is read from
         coordinates in core/Input.js, and an element that could be pressed
         would break multi-touch the moment a thumb rested on it. */
      .hints {
        position: fixed;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        transition: opacity 900ms ease;
      }

      .hints-faded {
        opacity: 0;
      }

      .hint {
        position: absolute;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        height: 34%;
        color: rgba(160, 230, 255, 0.5);
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.22em;
      }

      .hint-left {
        left: 0;
        border-right: 1px dashed rgba(120, 200, 255, 0.14);
      }

      .hint-right {
        right: 0;
      }

      .hint-brake {
        bottom: auto;
        height: auto;
        align-items: center;
        padding: 0;
        border: 1px solid rgba(255, 90, 160, 0.4);
        border-radius: 10px;
        background: rgba(255, 60, 140, 0.07);
        color: rgba(255, 150, 190, 0.75);
      }

      /* Said once, when tilt is asked for and refused. */
      .control-notice {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        z-index: 40;
        max-width: 80vw;
        padding: 10px 16px;
        border: 1px solid rgba(255, 90, 160, 0.35);
        border-radius: 8px;
        background: rgba(10, 8, 18, 0.9);
        color: #ffd9ea;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      .rotate-gate {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #05060c;
        color: #d8e6ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .rotate-gate-on {
        display: flex;
      }

      .rotate-icon svg {
        width: 84px;
        height: 84px;
        fill: none;
        stroke: #37e6ff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* Turning, because the instruction is a movement. Slow and finite in
           feel rather than a spinner: this is a prompt, not a loading state. */
        animation: rotate-hint 2.4s ease-in-out infinite;
      }

      @keyframes rotate-hint {
        0%, 45% { transform: rotate(0deg); }
        65%, 100% { transform: rotate(-90deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .rotate-icon svg {
          animation: none;
          transform: rotate(-90deg);
        }
      }

      .rotate-title {
        font-size: clamp(18px, 5vw, 28px);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #ff4fd8;
      }

      .rotate-body {
        font-size: clamp(13px, 3.4vw, 16px);
        opacity: 0.75;
        max-width: 22em;
        line-height: 1.5;
      }

      .hud {
        position: fixed;
        left: 18px;
        bottom: 16px;
        z-index: 12;
        pointer-events: none;
        color: #eaf6ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* The frame under this is mostly bloom, so the readout carries its own
           dark halo rather than relying on whatever happens to be behind it. */
        text-shadow:
          0 0 4px rgba(0, 0, 0, 0.9),
          0 0 14px rgba(0, 0, 0, 0.7),
          0 0 26px rgba(45, 227, 255, 0.5);
      }

      .hud-score {
        font-size: clamp(1.6rem, 5vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1;
      }

      /* Lives. Sits between the score and the distance, so the one thing that
         changes suddenly is next to the two that change constantly. */
      .hud-lives {
        margin-top: 2px;
        font-size: clamp(0.8rem, 2.6vw, 1.05rem);
        letter-spacing: 0.22em;
        color: #ff6e8a;
        text-shadow: 0 0 10px rgba(255, 80, 120, 0.55);
      }

      .hud-meta {
        margin-top: 4px;
        font-size: clamp(0.62rem, 1.9vw, 0.78rem);
        letter-spacing: 0.22em;
        color: rgba(190, 220, 255, 0.72);
      }

      /* Pause and game over. Deliberately the same object as the title card. */
      .panel {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        text-align: center;
        padding: 0 16px;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(10, 4, 28, 0.62) 0%,
          rgba(2, 1, 8, 0.9) 70%
        );
        pointer-events: none;
        opacity: 0;
        transition: opacity 420ms ease-out;
      }

      .panel.panel-in {
        opacity: 1;
      }

      /* The two halves of the pause card: what you read, and what you press. */
      .panel-read,
      .panel-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
      }


      .panel-title {
        margin: 0 0 0.4rem;
        font: 700 clamp(1.5rem, 6.5vw, 3rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.2em;
        color: #ffd9ef;
        text-shadow:
          0 0 12px rgba(255, 43, 208, 0.8),
          0 0 44px rgba(255, 43, 208, 0.4);
      }

      .panel-score {
        font: 700 clamp(2.6rem, 13vw, 5rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.04em;
        color: #eaf6ff;
        text-shadow:
          0 0 10px rgba(45, 227, 255, 0.85),
          0 0 40px rgba(45, 227, 255, 0.4);
      }

      .panel-best {
        font: 500 clamp(0.7rem, 2.4vw, 0.9rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.26em;
        color: rgba(190, 220, 255, 0.66);
        min-height: 1.2em;
      }

      /* A record is the one moment the interface is allowed to shout. */
      .panel-record .panel-best {
        color: #9dffc9;
        text-shadow: 0 0 12px rgba(57, 255, 136, 0.7);
      }

      .panel-prompt {
        margin: 1.1rem 0 0;
        font: 500 clamp(0.7rem, 2.4vw, 0.9rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        color: rgba(200, 226, 255, 0.72);
        animation: start-pulse 2.4s ease-in-out infinite;
      }

      /* Reduced motion switch. The one thing on either card that can be
         pressed, so it is the one thing that takes pointer events. */
      .comfort-toggle {
        pointer-events: auto;
        margin-top: 1.4rem;
        padding: 10px 18px;
        border: 1px solid rgba(45, 227, 255, 0.35);
        border-radius: 999px;
        background: rgba(6, 10, 24, 0.66);
        color: rgba(200, 226, 255, 0.78);
        font: 500 clamp(0.62rem, 2vw, 0.76rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.2em;
        cursor: pointer;
        /* Comfortable to hit on a phone without looking. */
        min-height: 44px;
        transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
      }

      .comfort-toggle:hover,
      .comfort-toggle:focus-visible {
        border-color: rgba(45, 227, 255, 0.7);
        color: #eaf6ff;
        outline: none;
      }

      .comfort-toggle.comfort-on {
        border-color: rgba(57, 255, 136, 0.65);
        background: rgba(10, 30, 20, 0.7);
        color: #9dffc9;
      }

      @media (prefers-reduced-motion: reduce) {
        .start-prompt,
        .panel-prompt { animation: none; }
        .start-screen,
        .panel { transition-duration: 1ms; }
      }
      /* A LANDSCAPE PHONE IS ABOUT 360 CSS PIXELS TALL. Stacked, this card's
         six blocks ran off the bottom of it and the control buttons could not
         be reached at all - and there is nothing to scroll, because the page
         does not scroll. Below 520px of height the card lays out as two
         columns, which fits every landscape handset with room over.

         Height, not width, and not a device query: the thing that is short is
         the viewport, whatever is making it short. */
      @media (max-height: 520px) {
        .panel {
          flex-direction: row;
          gap: 2rem;
          padding: 8px 18px;
          align-items: center;
        }

        .panel-read,
        .panel-actions {
          gap: 0.4rem;
          max-width: 46vw;
        }

        /* The type has to come down with it, or the left column is what
           overflows instead of the right one. */
        .panel-title { font-size: clamp(1.1rem, 4.2vw, 1.9rem); }
        .panel-score { font-size: clamp(1.4rem, 5vw, 2.4rem); }
        .panel-prompt { font-size: clamp(0.58rem, 1.9vw, 0.76rem); }

        .controls-panel { margin-top: 4px; }
        .controls-btn { min-height: 34px; padding: 6px 10px; font-size: 10px; }
        .comfort-toggle { min-height: 34px; padding: 6px 10px; }
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
