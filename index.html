<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>NEON RIDE</title>
    <style>
      /* Full screen canvas: no scrolling, no margins, black background */
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        /* Disable scroll and zoom gestures on touch devices */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Only until the first resize: from then on Engine writes the canvas an
         inline size in CSS pixels, because on a phone this element's 100% is
         the layout viewport and the frame is drawn for the visible one. */
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Top left measurement overlay (filled in by StatsOverlay.js) */
      .stats-overlay {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        margin: 0;
        padding: 6px 10px;
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.45);
        color: #7ff9ff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
        white-space: pre;
        pointer-events: none;
      }

      /* Title card. Removes itself once the ride starts; see ui/StartScreen.js. */
      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(10, 4, 28, 0.55) 0%,
          rgba(2, 1, 8, 0.88) 70%
        );
        /* The scene keeps running behind it, so the card must not eat the
           gesture before the window-level listeners see it. */
        pointer-events: none;
        opacity: 1;
        transition: opacity 420ms ease-out;
      }

      .start-screen.start-leaving {
        opacity: 0;
      }

      .start-title {
        margin: 0;
        font: 700 clamp(2.4rem, 11vw, 5.5rem) / 1 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.16em;
        color: #eaf6ff;
        /* The bloom lives in the render pass, not in CSS, so the title gets its
           own glow rather than looking flat beside the road behind it. */
        text-shadow:
          0 0 10px rgba(45, 227, 255, 0.85),
          0 0 34px rgba(45, 227, 255, 0.45),
          0 0 70px rgba(255, 43, 208, 0.35);
      }

      .start-prompt {
        margin: 0;
        font: 500 clamp(0.75rem, 2.6vw, 1rem) / 1.4 ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        letter-spacing: 0.34em;
        text-indent: 0.34em; /* letter-spacing adds a trailing gap; this recentres */
        color: rgba(200, 226, 255, 0.72);
        animation: start-pulse 2.4s ease-in-out infinite;
      }

      @keyframes start-pulse {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .start-prompt { animation: none; }
        .start-screen { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
