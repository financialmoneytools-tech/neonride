<!doctype html>
<meta charset="utf-8" />
<title>glove sprite</title>
<style>
  body { margin: 0; background: #0a0a10; color: #7ff9ff;
         font: 13px ui-monospace, Consolas, monospace; }
  .row { display: flex; gap: 24px; padding: 20px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { padding: 6px 2px; letter-spacing: .04em; }
  .checks { background-image:
      linear-gradient(45deg, #2a2a32 25%, transparent 25%, transparent 75%, #2a2a32 75%),
      linear-gradient(45deg, #2a2a32 25%, transparent 25%, transparent 75%, #2a2a32 75%);
    background-size: 24px 24px; background-position: 0 0, 12px 12px; background-color: #1a1a20; }
  .road { background: linear-gradient(160deg, #06060d 0%, #0d1526 55%, #121a2c 100%); }
  canvas { display: block; }
</style>
<div class="row" id="row"></div>
<script type="module">
  import { paintGlove } from '/src/player/rider/hands/glovePaint.js';
  import { config } from '/src/config.js';

  const row = document.getElementById('row');
  const cfg = config.player.rider.hand.sprite;

  function panel(label, sign, cls, scale) {
    const fig = document.createElement('figure');
    fig.className = cls;
    const canvas = document.createElement('canvas');
    canvas.width = cfg.texture.width * scale;
    canvas.height = cfg.texture.height * scale;
    paintGlove(canvas.getContext('2d'), sign);
    const cap = document.createElement('figcaption');
    cap.textContent = label;
    fig.append(canvas, cap);
    row.appendChild(fig);
  }

  panel('RIGHT on checks (alpha)', 1, 'checks', 1);
  panel('RIGHT on road', 1, 'road', 1);
  panel('LEFT on road', -1, 'road', 1);

  // And at the size it will actually be: about 2.5 per cent of a 1080p frame
  // per hand, which is roughly 160 px across. If it does not read here it does
  // not read in the game.
  const small = document.createElement('div');
  small.className = 'row';
  small.style.background = 'linear-gradient(160deg,#06060d,#0d1526 55%,#121a2c)';
  document.body.appendChild(small);
  for (const [label, sign] of [['LEFT at true size', -1], ['RIGHT at true size', 1]]) {
    const fig = document.createElement('figure');
    const canvas = document.createElement('canvas');
    canvas.width = cfg.texture.width;
    canvas.height = cfg.texture.height;
    paintGlove(canvas.getContext('2d'), sign);
    canvas.style.width = '160px';
    canvas.style.height = '160px';
    const cap = document.createElement('figcaption');
    cap.textContent = label;
    fig.append(canvas, cap);
    small.appendChild(fig);
  }
</script>
